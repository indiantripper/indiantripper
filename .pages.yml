# Saving publishes immediately. This public repository is not draft storage.
media:
  input: static/images
  output: /images
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - gif
  rename: random
content:
- name: posts
  label: Posts
  description: Save publishes your changes to the blog. Keep unfinished writing outside this editor.
  type: collection
  path: content/posts
  subfolders: true
  format: yaml-frontmatter
  filename:
    template: '{year}-{month}-{day}-{title}-{hour}{minute}{second}.html'
    field: false
  operations:
    create: true
    rename: false
    delete: false
  view:
    fields:
    - title
    - date
    - categories
    primary: title
    sort:
    - date
    - title
    search:
    - title
    - body
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: date
    label: Post date
    type: date
    required: true
    options:
      time: true
      format: yyyy-MM-dd HH:mm:ss
  - name: categories
    label: Threads
    type: select
    required: true
    default:
    - life-and-philosophy
    options:
      multiple: true
      min: 1
      values:
      - name: rambling
        label: Passing Thoughts
      - name: life-and-philosophy
        label: Life & Reflections
      - name: college-2
        label: College Days
      - name: poem-humor-fiction
        label: Poems & Stories
      - name: epic-retellings
        label: Epic Retellings
      - name: travel
        label: Travels
      - name: cyber-world
        label: Digital Life
      - name: books-and-movies
        label: Books & Films
      - name: nitie-2
        label: NITIE Days
      - name: sports
        label: Sports
      - name: uncategorized
        label: Odds & Ends
      - name: pets-2
        label: Furry Friends
  - name: language
    label: Post language
    type: select
    default: auto
    options:
      values:
      - name: auto
        label: Detect from title
      - name: hi
        label: हिंदी
      - name: en
        label: English
  - name: form
    label: Writing form
    type: select
    default: prose
    options:
      values:
      - name: prose
        label: Prose / story
      - name: poem
        label: Poem
  - name: excerpt
    label: Short preview
    type: text
    description: Optional teaser for previews and shared links. Leave blank on poems to show the first four lines.
  - name: image
    label: Share cover
    type: image
    description: Optional. Upload or choose the image shown when sharing this post.
    options:
      extensions:
      - jpg
      - jpeg
      - png
      - webp
      rename: random
  - name: share_image
    label: Link preview override
    type: image
    description: Optional image used only in sharing, such as a title card. It is not added to the article.
  - name: share_slug
    label: Short share link
    type: string
    description: Optional stable short name using lowercase Roman letters, numbers and hyphens, for example pret-aatmaaye. Leave blank to retain the existing link.
  - name: image_alt
    label: Cover description
    type: string
  - name: body
    label: Your post
    type: rich-text
    required: true
    options:
      format: html
      extensions:
      - jpg
      - jpeg
      - png
      - webp
      - gif
      rename: random
      switcher: true
  - name: id
    type: string
    hidden: true
    readonly: true
  - name: path
    type: string
    hidden: true
    readonly: true
settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: Publish {filename} from editor
      update: Update {filename} from editor
